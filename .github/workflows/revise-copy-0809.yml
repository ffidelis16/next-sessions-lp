name: Revisar copy evento 08-09

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/revise-copy-0809.yml

permissions:
  contents: write

jobs:
  revise-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revisar arquivos
        run: python scripts/revise_copy_0809.py

      - name: Validar termos indevidos
        run: |
          ! grep -R "degustação de vinho\|guiada por sommelier\|Descrição do case em validação" \
            evento-08-09-marca-valor.html \
            docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.html

      - name: Publicar revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evento-08-09-marca-valor.html docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.html
          git diff --cached --quiet && exit 0
          git commit -m "Revisa copy e neutraliza experiência da edição de 08/09"
          git push
