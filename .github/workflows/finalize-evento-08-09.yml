name: Finalize evento 08-09

on:
  push:
    branches:
      - evento-08-09-marca-valor
    paths:
      - scripts/finalize_evento_08_09.py
      - .github/workflows/finalize-evento-08-09.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evento-08-09-marca-valor
          fetch-depth: 0
      - run: python scripts/finalize_evento_08_09.py
      - run: |
          grep -q "Encontro presencial e gratuito" evento-08-09-marca-valor.html
          grep -q "lideranças de marcas em crescimento" evento-08-09-marca-valor.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evento-08-09-marca-valor.html docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Finaliza microcopy e qualificação da página 08/09"
            git push origin HEAD:evento-08-09-marca-valor
          fi
