name: Build evento 08-09

on:
  push:
    branches:
      - evento-08-09-marca-valor
    paths:
      - scripts/build_evento_08_09.py
      - .github/workflows/build-evento-08-09.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: evento-08-09-marca-valor
          fetch-depth: 0

      - name: Gerar edição 08/09
        run: python scripts/build_evento_08_09.py

      - name: Validar arquivos gerados
        run: |
          test -s evento-08-09-marca-valor.html
          test -s docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.html
          test -s docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.css
          test -s docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.js
          grep -q "Quando a marca sustenta valor" evento-08-09-marca-valor.html
          grep -q "Quero participar" evento-08-09-marca-valor.html
          grep -q "09082026-0000-4000-8000-000000000001" docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.js

      - name: Commitar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evento-08-09-marca-valor.html \
            docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.html \
            docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.css \
            docs/hubspot-implementation/entrega-final-plano-a/developer-files/evento-marca-valor.js \
            docs/hubspot-implementation/entrega-final-plano-a/RELATORIO-EVENTO-08-09-MARCA-VALOR.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Gera página 08/09 com nova copy"
            git push origin HEAD:evento-08-09-marca-valor
          fi
